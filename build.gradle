plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'com.modrinth.minotaur' version "${minotaur_version}"
    id 'maven-publish'
}

version = System.getenv("SKYHUB_VERSION") ?: project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional ModMenu integration (compile-only; gracefully guarded at runtime)
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Unit testing for search index, normalization, adapter isolation, and HUD snapping
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def modVersion = project.version.toString()
    def mcVersion = project.minecraft_version.toString()
    def loaderVersion = project.loader_version.toString()

    inputs.property "version", modVersion
    inputs.property "minecraft_version", mcVersion
    inputs.property "loader_version", loaderVersion

    filesMatching("fabric.mod.json") {
        expand(
            "version": modVersion,
            "minecraft_version": mcVersion,
            "loader_version": loaderVersion
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
}

jar {
    def archiveBase = project.base.archivesName.get()
    inputs.property "archivesName", archiveBase
    from("LICENSE") {
        rename { "${it}_${archiveBase}" }
    }
}

def resolvedVersionStr = project.version.toString()
def inferredVersionType = System.getenv("MODRINTH_VERSION_TYPE") ?: (
    resolvedVersionStr.contains("alpha") ? "alpha" :
    resolvedVersionStr.contains("beta") ? "beta" : "release"
)

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = (System.getenv("MODRINTH_PROJECT_ID") ?: project.findProperty("modrinth_project_id") ?: "").toString()
    versionNumber = resolvedVersionStr
    versionName = "SkyHub ${resolvedVersionStr}"
    versionType = inferredVersionType
    uploadFile = tasks.jar
    gameVersions = [project.minecraft_version.toString()]
    loaders = ["fabric"]
    changelog = System.getenv("RELEASE_CHANGELOG") ?: "See https://github.com/Rhyn0w0/skyhub/releases for details."
    syncBodyFrom = rootProject.file("README.md").text.replaceFirst(/(?s)^<img[^>]*>\s*/, "")
    dependencies {
        required.project "fabric-api"
        optional.project "modmenu"
    }
}
