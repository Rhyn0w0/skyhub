plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional ModMenu integration (compile-only; gracefully guarded at runtime)
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Unit testing for search index, normalization, adapter isolation, and HUD snapping
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def modVersion = project.version
    def mcVersion = project.minecraft_version
    def loaderVersion = project.loader_version

    inputs.property "version", modVersion
    inputs.property "minecraft_version", mcVersion
    inputs.property "loader_version", loaderVersion

    filesMatching("fabric.mod.json") {
        expand(
            "version": modVersion,
            "minecraft_version": mcVersion,
            "loader_version": loaderVersion
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
}

jar {
    def archiveBase = project.base.archivesName.get()
    inputs.property "archivesName", archiveBase
    from("LICENSE") {
        rename { "${it}_${archiveBase}" }
    }
}
