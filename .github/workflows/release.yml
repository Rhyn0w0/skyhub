name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Modrinth channel (auto, alpha, beta, release)'
        required: false
        default: 'auto'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_TAG="${GITHUB_REF_NAME#v}"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${RAW_TAG}+sbe5.4.9-mc26.2" >> "$GITHUB_OUTPUT"
          else
            PROP_VER=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2-)
            echo "tag=v${PROP_VER%%+*}" >> "$GITHUB_OUTPUT"
            echo "version=${PROP_VER}" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${GITHUB_REF_NAME}" == *"alpha"* ]] || [[ "${GITHUB_REF_NAME}" == *"beta"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          CHANNEL="${{ inputs.version_type }}"
          if [[ -z "$CHANNEL" || "$CHANNEL" == "auto" ]]; then
            if [[ "${GITHUB_REF_NAME}" == *"alpha"* ]]; then
              CHANNEL="alpha"
            elif [[ "${GITHUB_REF_NAME}" == *"beta"* ]]; then
              CHANNEL="beta"
            else
              CHANNEL="release"
            fi
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Build & Test
        env:
          SKYHUB_VERSION: ${{ steps.meta.outputs.version }}
        run: ./gradlew clean build

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: SkyHub ${{ steps.meta.outputs.tag }} (SBE 5.4.9 / MC 26.2)
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            build/libs/skyhub-*.jar

      - name: Publish to Modrinth
        env:
          SKYHUB_VERSION: ${{ steps.meta.outputs.version }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_VERSION_TYPE: ${{ steps.meta.outputs.channel }}
          RELEASE_CHANGELOG: "Release ${{ steps.meta.outputs.tag }} for SkyBlock Enhanced 5.4.9 (MC 26.2). Full notes: https://github.com/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.tag }}"
        run: |
          PROP_ID=$(grep '^modrinth_project_id=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')
          EFFECTIVE_ID="${MODRINTH_PROJECT_ID:-$PROP_ID}"
          if [[ -z "$MODRINTH_TOKEN" || -z "$EFFECTIVE_ID" ]]; then
            echo "::notice::Skipping Modrinth upload (set repo secret MODRINTH_TOKEN and repo variable MODRINTH_PROJECT_ID or gradle.properties modrinth_project_id to enable)."
            exit 0
          fi
          MODRINTH_PROJECT_ID="$EFFECTIVE_ID" ./gradlew modrinth --no-configuration-cache
